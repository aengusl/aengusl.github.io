# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

title: "Aengus Lynch"
email: aenguslynch@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Formally verifying software at Theorem. PhD in Computer Science from UCL; lead author of Anthropic's Agentic Misalignment research.
baseurl: ""
url: "https://www.aenguslynch.com"
author: Aengus Lynch
social:
  twitter: aengus_lynch1
  github: aengusl
  google_scholar: Pd2002AAAAAJ
  linkedin: aengus-lynch-2876a6125

# Social media usernames
twitter_username:
github_username: aengusl

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Add these SEO-specific fields
twitter:
  username: aengus_lynch1
  card: summary
social_links:
  twitter: aengus_lynch1
  github: aengusl
  linkedin: aengus-lynch-2876a6125

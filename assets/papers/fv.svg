<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 14 765 396" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="400" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1e1108">Proving open-source code never crashes</text>

  <!-- Step boxes -->
  <g font-size="17" text-anchor="middle">
    <rect x="30" y="110" width="160" height="110" rx="12" fill="#e3edf7" stroke="#6b8fb5" stroke-width="2"/>
    <text x="110" y="152" font-weight="700" fill="#1e1108">123 libraries</text>
    <text x="110" y="178" fill="#333">239 fuzzing</text>
    <text x="110" y="200" fill="#333">entry points</text>

    <rect x="225" y="110" width="160" height="110" rx="12" fill="#f6ead7" stroke="#c08a3e" stroke-width="2"/>
    <text x="305" y="152" font-weight="700" fill="#1e1108">Claude writes</text>
    <text x="305" y="178" fill="#333">~180M lines</text>
    <text x="305" y="200" fill="#333">of Rocq proofs</text>

    <rect x="420" y="110" width="160" height="110" rx="12" fill="#ece4f4" stroke="#8a6bb5" stroke-width="2"/>
    <text x="500" y="152" font-weight="700" fill="#1e1108">Proof checker</text>
    <text x="500" y="178" fill="#333">at the RISC-V</text>
    <text x="500" y="200" fill="#333">binary level</text>

    <rect x="615" y="95" width="160" height="62" rx="12" fill="#dff1e3" stroke="#4f9a63" stroke-width="2"/>
    <text x="695" y="122" font-weight="700" fill="#1e5a2e">✓ Crash-free</text>
    <text x="695" y="144" fill="#333">239 proved</text>

    <rect x="615" y="173" width="160" height="62" rx="12" fill="#f8e1dd" stroke="#c0574a" stroke-width="2"/>
    <text x="695" y="200" font-weight="700" fill="#8a2a1f">✗ Bugs found</text>
    <text x="695" y="222" fill="#333">hundreds</text>
  </g>

  <!-- Arrows -->
  <g stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="192" y1="165" x2="222" y2="165"/>
    <line x1="387" y1="165" x2="417" y2="165"/>
    <path d="M582 150 L612 128"/>
    <path d="M582 180 L612 202"/>
  </g>

  <!-- Footer: the guarantee -->
  <rect x="30" y="290" width="745" height="110" rx="12" fill="#faf8f5" stroke="#d8d0c4" stroke-width="1.5"/>
  <text x="402" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1108">A proof covers every input, not just the ones a fuzzer tried</text>
  <text x="402" y="364" text-anchor="middle" font-size="16" fill="#4a3623">Fuzzing samples inputs; a machine-checked proof rules out a whole class of crashes</text>
  <text x="402" y="386" text-anchor="middle" font-size="14" fill="#705f50">Anthropic Frontier Red Team with Theorem, Oct 2026</text>
</svg>
